# Inside the "server { listen 443 ssl; server_name simba.fdi.ucm.es; ... }" block.
# Only /background (BASE_PATH) is sent to the application; the rest of the host is untouched.

location /background/static/ {
    alias /opt/catholic-background/staticfiles/;
}

location = /background {
    include /etc/nginx/catholic-background-proxy.conf;
}

location /background/ {
    client_max_body_size 30M;
    include /etc/nginx/catholic-background-proxy.conf;
}

# /etc/nginx/catholic-background-proxy.conf (copy deploy/nginx-proxy.conf there):
#     proxy_pass http://127.0.0.1:8000;
#     ...
