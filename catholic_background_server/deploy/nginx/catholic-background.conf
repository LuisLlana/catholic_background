#
# Catholic Background (BASE_PATH=background, gunicorn on 127.0.0.1:8000).
# Copy to /etc/nginx/snippets/ and include it inside the "server" block of the site:
#     include snippets/catholic-background.conf;
# If BASE_PATH is different, replace /background everywhere in this file.

# The image of the day: exactly /background
location = /background {
    include snippets/catholic-background-proxy.conf;
}

# Files of the admin site (python manage.py collectstatic)
location /background/static/ {
    alias /opt/catholic-background/staticfiles/;
}

# The rest of the application: /background/...
location /background/ {
    client_max_body_size 30M;    # image uploads (nginx accepts only 1 MB by default)
    include snippets/catholic-background-proxy.conf;
}
