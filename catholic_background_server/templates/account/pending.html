{% extends "base.html" %}
{% block title %}Waiting for approval · Catholic Background{% endblock %}
{% block content %}
<div class="card">
  <h1>Waiting for approval</h1>
  <p>You are logged in as <strong>{{ user.email }}</strong>, but your account cannot manage
     artworks yet. An administrator has to approve it.</p>
  <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}
    <button class="provider" type="submit">Log out</button>
  </form>
</div>
{% endblock %}
