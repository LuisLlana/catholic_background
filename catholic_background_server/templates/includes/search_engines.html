{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}
{# For search engines and for links shared in messaging apps: description, canonical address, preview #}
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Catholic Background">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:locale" content="{{ CURRENT_LANGUAGE|cut:'-' }}">
{% if og_image %}<meta property="og:image" content="{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">{% endif %}
{% if google_site_verification %}<meta name="google-site-verification" content="{{ google_site_verification }}">{% endif %}
{% if bing_site_verification %}<meta name="msvalidate.01" content="{{ bing_site_verification }}">{% endif %}
